server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: white-quantex-company-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:WhiteQuantex-Financial-Database}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:8426}
  flyway:
    enabled: true
    baseline-on-migrate: true
    table: flyway_company_history
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
  mvc:
    async:
      request-timeout: 300000

app:
  jwt:
    secret: ${JWT_SECRET:8Zz5twkAG57M61Jg6oTz8pX3sM4vP6wY8z0aB2cD4eF6gH8iJ0kL2mN4oP6qR8sT}
    expiration: 604800000
    refresh-expiration: 1209600000
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:7001,http://127.0.0.1:7001,http://localhost:7000,http://127.0.0.1:7000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
