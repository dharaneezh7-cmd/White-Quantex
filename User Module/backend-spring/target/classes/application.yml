server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: white-quantex-financial-backen8d
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:WhiteQuantex-Financial-Database}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:8426}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

app:
  jwt:
    secret: ${JWT_SECRET:8Zz5twkAG57M61Jg6oTz8pX3sM4vP6wY8z0aB2cD4eF6gH8iJ0kL2mN4oP6qR8sT}
    expiration: 86400000
    refresh-expiration: 604800000
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:7000}
